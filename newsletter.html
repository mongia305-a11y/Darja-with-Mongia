<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Email updates — Darja with Mongia</title>
  <meta name="description" content="Get email updates from Darja with Mongia about new Tunisian Arabic lessons.">
  <script src="theme.js?v=1"></script>
  <link rel="stylesheet" href="theme.css?v=2">
  <link rel="stylesheet" href="cookie-consent.css?v=dark1">
  <script src="cookie-consent.js?v=5" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="newsletter-popup.css?v=portrait2">
  <script src="newsletter-popup.js?v=6" defer></script>
  <style>
    body { margin: 0; padding: 24px 0; background: var(--darja-bg-162, #faf7f9); }
    .darja-newsletter-dialog.darja-newsletter-page {
      display: block; position: relative; inset: auto;
      max-height: none; margin: max(16px, 5vh) auto 24px;
    }
    .darja-newsletter-page .darja-newsletter-close { text-decoration: none; }
    .darja-newsletter-page-footer { text-align: center; font-family: "Poppins", Arial, sans-serif; }
    @media (max-width: 600px) {
      body { padding: 0; }
      .darja-newsletter-dialog.darja-newsletter-page { margin: 12px auto; }
    }
  </style>
</head>
<body data-darja-newsletter-page>
  <main class="darja-newsletter-dialog darja-newsletter-page" aria-label="Email updates from Darja with Mongia">
    <div class="darja-newsletter-bar">
      <a href="/" aria-label="Darja with Mongia homepage"><img src="/images/full-logo.png" width="150" height="63" alt="Darja with Mongia"></a>
      <a href="/" class="darja-newsletter-close" aria-label="Return to the homepage"><span aria-hidden="true">×</span></a>
    </div>
    <form class="darja-signup" data-darja-signup data-sv-form="9978820" data-uid="bcbed786bc" data-format="inline" data-version="5" data-options='{"settings":{"after_subscribe":{"action":"message","success_message":"Success! Now check your email to confirm your subscription."},"recaptcha":{"enabled":false},"return_visitor":{"action":"show"}}}' action="https://app.kit.com/forms/9978820/subscriptions" method="post">
      <div class="darja-signup-layout">
        <div class="darja-signup-picture" aria-hidden="true"></div>
        <div class="darja-signup-content">
          <h2>Keep learning Tunisian Arabic!</h2>
          <ul class="darja-signup-errors" data-element="errors" role="alert"></ul>
          <div class="darja-signup-fields" data-element="fields">
            <label>Email Address
              <input name="email_address" type="email" autocomplete="email" inputmode="email" placeholder="Email Address" required>
            </label>
            <button type="submit" data-element="submit"><span>Keep me updated</span></button>
          </div>
          <p>Get email updates from Darja with Mongia about new lessons.</p>
          <p>We respect your privacy. Unsubscribe at any time.</p>
          <a class="darja-signup-provider" href="https://kit.com/" target="_blank" rel="noopener">Built with Kit</a>
        </div>
      </div>
    </form>
    <p class="darja-newsletter-help"><a href="/">Back to the website</a></p>
  </main>
  <footer class="darja-newsletter-page-footer"></footer>
</body>
</html>
